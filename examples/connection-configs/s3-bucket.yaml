# Amazon S3 Bucket
# Use for: S3 data lakes, cloud object storage

name: s3_data_lake
source_type: s3
description: "Amazon S3 Data Lake"

params:
  # S3 URI (bucket and prefix)
  # Format: s3://bucket-name/prefix/
  uri: "s3://my-data-lake/raw/"

  # AWS Region
  region: "us-east-1"

  # AWS Credentials (use environment variables for security)
  access_key_id: "${AWS_ACCESS_KEY_ID}"
  secret_access_key: "${AWS_SECRET_ACCESS_KEY}"

profiling:
  sample_size: 10000
  max_depth: 10

metadata:
  created: "2026-06-11"
  tags: ["s3", "data-lake", "aws"]

# Usage:
# export AWS_ACCESS_KEY_ID="AKIA..."
# export AWS_SECRET_ACCESS_KEY="wJalrXUtnFEMI/K7MDENG+/..."
# datalens analyze --cc s3_data_lake

# Alternative: Use IAM Role (if running on EC2)
# If using EC2 with IAM role, omit the keys:
# params:
#   uri: "s3://my-data-lake/raw/"
#   region: "us-east-1"
#   # Keys will be loaded from EC2 metadata service

# To get AWS credentials:
# 1. AWS Console → IAM → Users
# 2. Create access keys or use existing ones
# 3. Store in environment variables (never hardcode!)
