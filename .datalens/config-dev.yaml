# Datalens Configuration
# Copy to config.yaml and customize
#
# Auto-discovery: this file is picked up automatically (no --config flag
# needed) from, in order: .datalens/config.yaml, ~/.datalens/config.yaml.
#
# Env swimlanes (dev/staging/prod, ...): add .datalens/config-{env}.yaml with
# just the keys that differ; it's layered on top of the base file above.
# Select it via --env {env} or the DATALENS_ENV environment variable.
# Example: config-prod.yaml with a stricter sample_size or coverage_thresholds.
# Precedence overall: CLI flags > connection config's own sections > this
# file's env overlay > this file's base values > built-in defaults.

# Sampling
sample_size: 1000          # Records to sample per object
max_depth: 10              # Maximum nesting depth
max_array_depth: 3         # Maximum nested array depth
max_array_items: 100       # Array elements to process (0 = unlimited)
max_distinct_values: 500   # Distinct values to track per field
max_examples: 5            # Example values per field
sample_records_count: 3    # Full sample records in output

# Analysis
low_cardinality_threshold: 50  # Fields with <= N distinct values

# Coverage-drift breach thresholds (used with --detect-drift / --compare-to).
# Most-specific wins: field > object > dataset. Omit entirely to disable.
# coverage_thresholds:
#   dataset: 10                     # global default (%-points)
#   objects:
#     orders_sample: 15              # overrides dataset for this object's fields
#   fields:
#     orders_sample:
#       "customer.email": 25         # overrides object/dataset for this one field
# report_coverage_reduction_exceeds: true   # flag coverage drops beyond threshold
# report_coverage_increase_exceeds: true    # flag coverage rises beyond threshold

# Output
out_dir: "output"          # Output directory

# Privacy
mask_pii: true             # Mask detected PII in reports

# AI (optional) — see secrets.yaml.example for credentials
# off       = disabled (default)
# auto      = auto-detect: license providers first, then API keys
# anthropic = Claude API (API key)
# openai    = OpenAI API (API key)
# cursor    = Cursor subscription via cursor-agent login, or CURSOR_API_KEY
# copilot   = GitHub Copilot via `gh auth login` + `gh copilot`
# claude    = Claude Code / Desktop CLI (`claude` on PATH)
#ai_provider: "off"
ai_provider: "copilot"

# Debug
debug: false
