[project]
name = "datalens-ai"
version = "0.0.1"
description = "Advanced schema analysis and data profiling tool for data analysts and engineers"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Datalens Contributors" }
]
keywords = ["schema", "analysis", "profiling", "mongodb", "data-quality", "data-lineage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.6.0",
    "pandas>=2.0.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.25.0",
    "openai>=1.30.0",
    "cursor-sdk>=0.1.3",
]
cloud = [
    "boto3>=1.34.0",      # S3 connector + CloudWatch metrics
    "httpx>=0.27.0",      # HTTP connector + webhooks
    "paramiko>=3.4.0",    # SFTP connector
]
alerts = [
    "httpx>=0.27.0",      # Slack, webhooks, PagerDuty
]
metrics = [
    "httpx>=0.27.0",      # Prometheus, Datadog, HTTP sinks
    "boto3>=1.34.0",      # CloudWatch metrics
]
all = [
    "anthropic>=0.25.0",
    "openai>=1.30.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "paramiko>=3.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
datalens = "datalens.cli:main"

[project.urls]
Homepage = "https://github.com/datalens-ai/datalens"
Documentation = "https://github.com/datalens-ai/datalens#readme"
Repository = "https://github.com/datalens-ai/datalens"
Issues = "https://github.com/datalens-ai/datalens/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datalens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
