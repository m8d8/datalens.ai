[project]
name = "datalens-ai"
dynamic = ["version"]
description = "Data health intelligence: profiling, quality scores, learned drift baselines, expected-schema checks and an action plan for any data source"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Datalens Contributors" }
]
keywords = ["data-quality", "data-profiling", "schema", "schema-drift", "data-drift", "data-contracts",
            "json-schema", "pii", "mongodb", "bigquery", "observability", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.6.0",
    "pandas>=2.0.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.25.0",
    "openai>=1.30.0",
    "cursor-sdk>=0.1.3",
]
cloud = [
    "boto3>=1.34.0",      # S3 connector + CloudWatch metrics
    "httpx>=0.27.0",      # HTTP connector + webhooks
    "paramiko>=3.4.0",    # SFTP connector
]
bigquery = [
    "google-cloud-bigquery>=3.11.0",   # BigQuery connector
]
alerts = [
    "httpx>=0.27.0",      # Slack, webhooks, PagerDuty
]
metrics = [
    "httpx>=0.27.0",      # Prometheus, Datadog, HTTP sinks
    "boto3>=1.34.0",      # CloudWatch metrics
]
all = [
    "anthropic>=0.25.0",
    "openai>=1.30.0",
    "google-cloud-bigquery>=3.11.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "paramiko>=3.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
datalens = "datalens.cli:main"

[project.urls]
Homepage = "https://github.com/m8d8/datalens.ai"
Documentation = "https://github.com/m8d8/datalens.ai#readme"
Repository = "https://github.com/m8d8/datalens.ai"
Issues = "https://github.com/m8d8/datalens.ai/issues"
Changelog = "https://github.com/m8d8/datalens.ai/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/datalens/__init__.py"   # single source of truth: __version__

[tool.hatch.build.targets.wheel]
packages = ["src/datalens"]

[tool.hatch.build.targets.sdist]
# Explicit allow-list: never ship local config, outputs, demo data or editor files to PyPI
include = [
    "/src/datalens",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]
exclude = ["tests/**/__pycache__"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
